# Gradle Configuration for Contracts Finder Library
org.gradle.jvmargs=-XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.build.scan.upload=false
org.gradle.workers.max=4

# Minimize JAR size
org.gradle.java.compile.incremental=true
