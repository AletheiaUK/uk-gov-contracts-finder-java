name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: ['17', '21']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Run tests
        run: ./gradlew test
      
      - name: Build JAR
        run: ./gradlew build
      
      - name: Check JAR size
        run: |
          JAR_SIZE=$(ls -lh build/libs/contracts-finder-*.jar | awk '{print $5}')
          echo "JAR Size: $JAR_SIZE"
          if [ "$JAR_SIZE" != "20K" ]; then
            echo "Warning: JAR size changed to $JAR_SIZE (expected 20K)"
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-files-java${{ matrix.java-version }}
          path: build/libs/contracts-finder-*.jar
